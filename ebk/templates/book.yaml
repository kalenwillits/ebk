metadata:
  title: "{book_title}"
  author: "{author_name}"
  language: "en-US"
  identifier: "{book_identifier}"
  date: "{current_date}"
  publisher: ""
  description: "A book created with ebk"
  subject: ""

# Optional cover image (relative to assets/images/)
# Uncomment and provide your cover image
# cover_image: "cover.jpg"

# Default CSS applied to all chapters (relative to assets/css/)
default_css:
  - "custom.css"

# Chapter discovery settings
content:
  # How to discover chapters: "auto" scans content/ recursively
  # Set to "manual" to specify chapter list explicitly
  discovery: "auto"

  # Optional: Manual chapter list (only used if discovery is "manual")
  # chapters:
  #   - path: "01-introduction.md"
  #     css: ""  # Optional per-chapter CSS override
  #   - path: "02-getting-started/_chapter.md"

# Output settings
output:
  filename: "{output_filename}"
