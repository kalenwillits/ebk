metadata:
  title: "Test Book"
  author: "Kalen Willits"
  language: "en-US"
  identifier: "28b92616-d4d2-44b8-a25b-83eeeba6788e"
  date: "2025-12-18"
  publisher: ""
  description: "A book created with ebk"
  subject: ""

# Optional cover image (relative to assets/images/)
# Uncomment and provide your cover image
# cover_image: "cover.jpg"

# Default CSS applied to all chapters
default_css:
  - "custom.css"

# Content discovery configuration
discovery:
  # Search only in the pages/ directory
  root: "pages"

  exclude:
    - ".git"
    - ".venv"
    - "venv"
    - "node_modules"
    - "__pycache__"
    - ".ebk"
    - "build"
    - "dist"
    - "context"

# Output settings
output:
  filename: "test-book.epub"
